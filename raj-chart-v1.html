<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAJ CHART — Phase + Momentum</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@300;400;600;700;900&display=swap');

:root {
  --bg: #f0f2f5;
  --surface: #ffffff;
  --surface2: #e8ecf2;
  --border: #c8d0dc;
  --orange: #d46a10;
  --white-ma: #334055;
  --blue-ma: #1a5cb5;
  --green: #0d7a70;
  --red: #cc2020;
  --text: #1a2030;
  --dim: #6a7a90;
  --accent: #d46a10;
  --yellow: #b07800;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Barlow Condensed', sans-serif;
  min-height: 100vh;
  padding: 14px;
}

/* ── HEADER ── */
.header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-bottom: 18px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}
.header-left h1 {
  font-size: 26px; font-weight: 900; letter-spacing: 4px;
  color: var(--accent); text-transform: uppercase;
}
.header-left .sub {
  font-size: 10px; letter-spacing: 2px; color: var(--dim);
  font-family: 'Share Tech Mono', monospace; margin-top: 2px;
}
.header-right {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px; color: var(--dim); text-align: right;
  letter-spacing: 1px;
}

/* ── TABS ── */
.tab-row {
  display: flex; gap: 4px; margin-bottom: 16px;
}
.tab {
  background: var(--surface); border: 1px solid var(--border);
  color: var(--dim); font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700; font-size: 12px; letter-spacing: 2px;
  padding: 8px 18px; cursor: pointer; text-transform: uppercase;
  transition: all 0.2s;
}
.tab.active { background: var(--accent); border-color: var(--accent); color: #000; }
.tab:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

/* ── INPUT SECTION ── */
.input-section { margin-bottom: 16px; }

.pairs-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 6px; margin-bottom: 12px;
}
.pair-btn {
  background: var(--surface); border: 1px solid var(--border);
  color: var(--dim); cursor: pointer; padding: 8px 10px;
  font-family: 'Share Tech Mono', monospace; font-size: 11px;
  letter-spacing: 1px; text-align: left; transition: all 0.2s;
  display: flex; flex-direction: column; gap: 2px;
}
.pair-btn:hover { border-color: var(--accent); color: var(--text); }
.pair-btn.active { border-color: var(--green); background: rgba(38,166,154,0.08); color: var(--green); }
.pair-base { font-size: 14px; font-weight: 700; color: var(--text); }
.pair-lev { font-size: 10px; color: var(--dim); }

.free-row {
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
}
.ticker-input {
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text); font-family: 'Share Tech Mono', monospace;
  font-size: 16px; padding: 10px 14px; width: 130px;
  text-transform: uppercase; letter-spacing: 2px; outline: none;
  transition: border-color 0.2s;
}
.ticker-input:focus { border-color: var(--accent); }
.ticker-input::placeholder { color: var(--dim); font-size: 12px; }

.btn {
  background: var(--accent); border: none; color: #000;
  font-family: 'Barlow Condensed', sans-serif; font-weight: 900;
  font-size: 13px; letter-spacing: 2px; padding: 10px 20px;
  cursor: pointer; text-transform: uppercase; transition: opacity 0.2s;
}
.btn:hover { opacity: 0.85; }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn-ghost {
  background: transparent; border: 1px solid var(--border);
  color: var(--dim); font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700; font-size: 13px; letter-spacing: 2px;
  padding: 10px 16px; cursor: pointer; text-transform: uppercase;
  transition: all 0.2s;
}
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

/* ── STATUS ── */
.status-bar {
  font-family: 'Share Tech Mono', monospace; font-size: 10px;
  color: var(--dim); margin-bottom: 14px; letter-spacing: 1px;
  min-height: 14px;
}
.loading { color: var(--orange); }
.ok { color: var(--green); }
.err { color: var(--red); }

/* ── PHASE BANNER ── */
.phase-banner {
  padding: 10px 16px; margin-bottom: 14px;
  border-left: 3px solid; font-weight: 900;
  font-size: 13px; letter-spacing: 3px; text-transform: uppercase;
}
.p-stealth    { border-color:#6a7a90; background:rgba(106,122,144,0.1);  color:#3a4a60; }
.p-awareness  { border-color:#1a5cb5; background:rgba(26,92,181,0.08);   color:#1a5cb5; }
.p-mania      { border-color:#d46a10; background:rgba(212,106,16,0.08);  color:#a04800; }
.p-dist       { border-color:#cc2020; background:rgba(204,32,32,0.08);   color:#aa1010; }
.p-bear       { border-color:#0d7a70; background:rgba(13,122,112,0.08);  color:#0d7a70; }
.p-cap        { border-color:#7b1fa2; background:rgba(123,31,162,0.08);  color:#6a0dad; }

/* ── SIGNAL CARDS ── */
.cards-row {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
  gap: 6px; margin-bottom: 14px;
}
.card {
  background: var(--surface); border: 1px solid var(--border);
  padding: 10px 12px;
}
.card-label {
  font-size: 9px; letter-spacing: 2px; color: var(--dim);
  text-transform: uppercase; font-family: 'Share Tech Mono', monospace;
  margin-bottom: 4px;
}
.card-value { font-size: 18px; font-weight: 700; }

/* ── LEVERAGED PAIR CARD ── */
.lev-card {
  background: var(--surface2); border: 1px solid var(--border);
  padding: 12px 16px; margin-bottom: 14px;
  display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
}
.lev-verdict {
  font-size: 20px; font-weight: 900; letter-spacing: 2px;
}
.lev-meta { font-family: 'Share Tech Mono', monospace; font-size: 10px; color: var(--dim); line-height: 1.8; }
.go    { color: var(--green); }
.nogo  { color: var(--red); }
.watch { color: var(--yellow); }

/* ── MA TAGS ── */
.ma-row { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
.ma-tag {
  padding: 3px 8px; font-size: 10px; letter-spacing: 1px;
  font-family: 'Share Tech Mono', monospace;
}
.above { background:rgba(13,122,112,0.12); color:#0d7a70; border:1px solid #0d7a70; }
.below { background:rgba(204,32,32,0.08);  color:#cc2020; border:1px solid #cc2020; }

/* ── CHARTS ── */
.chart-wrap { background:var(--surface); border:1px solid var(--border); padding:10px; margin-bottom:6px; }
.chart-lbl  { font-size:9px; letter-spacing:2px; color:var(--dim); font-family:'Share Tech Mono',monospace; margin-bottom:6px; text-transform:uppercase; }
.legend     { display:flex; gap:14px; flex-wrap:wrap; margin-bottom:6px; }
.leg-item   { display:flex; align-items:center; gap:5px; font-size:9px; letter-spacing:1px; color:var(--dim); font-family:'Share Tech Mono',monospace; }
.leg-line   { width:18px; height:2px; }
.chart-main { height:260px; }
.chart-osc  { height:110px; }
.chart-macd { height:90px; }

/* ── TICKER TITLE ── */
.ticker-title { font-size:26px; font-weight:900; letter-spacing:2px; margin-bottom:2px; }
.ticker-meta  { font-size:10px; color:var(--dim); letter-spacing:2px; font-family:'Share Tech Mono',monospace; margin-bottom:12px; }

/* ── EMPTY ── */
.empty { text-align:center; padding:60px 20px; color:var(--dim); }
.empty .icon { font-size:42px; opacity:0.2; margin-bottom:10px; }
.empty p { font-size:11px; letter-spacing:2px; text-transform:uppercase; font-family:'Share Tech Mono',monospace; }

/* ── PANELS ── */
.panel { display:none; }
.panel.visible { display:block; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>RAJ CHART</h1>
    <div class="sub">PHASE SCANNER + MOMENTUM COACH · WEEKLY · V1.0</div>
  </div>
  <div class="header-right">
    MA20 / MA50 / MA200<br>
    STOCH · MACD · PHASE
  </div>
</div>

<!-- TABS -->
<div class="tab-row">
  <div class="tab active" onclick="switchTab('pairs')">LEVERAGED PAIRS</div>
  <div class="tab" onclick="switchTab('free')">FREE TICKER</div>
</div>

<!-- PANEL: PAIRS -->
<div class="panel visible" id="panel-pairs">
  <div style="font-size:10px;letter-spacing:2px;color:var(--dim);margin-bottom:8px;font-family:'Share Tech Mono',monospace;">SELECT BASE STOCK — LEVERAGED PAIR SHOWN AUTOMATICALLY</div>
  <div class="pairs-grid" id="pairsGrid"></div>
  <div style="margin-top:8px;">
    <button class="btn" id="pairsLoadBtn" onclick="loadPair()">ANALYSE PAIR</button>
    <button class="btn-ghost" style="margin-left:6px" onclick="clearAll()">CLEAR</button>
  </div>
</div>

<!-- PANEL: FREE -->
<div class="panel" id="panel-free">
  <div style="font-size:10px;letter-spacing:2px;color:var(--dim);margin-bottom:8px;font-family:'Share Tech Mono',monospace;">KEY IN ANY TICKER</div>
  <div class="free-row">
    <input class="ticker-input" id="freeInput" placeholder="TSLA" maxlength="10" />
    <button class="btn" id="freeLoadBtn" onclick="loadFree()">ANALYSE</button>
    <button class="btn-ghost" onclick="clearAll()">CLEAR</button>
  </div>
  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;" id="freeQuick"></div>
</div>

<div class="status-bar" id="statusBar">READY.</div>
<div id="resultArea">
  <div class="empty">
    <div class="icon">◈</div>
    <p>Select a pair or key in a ticker</p>
  </div>
</div>

<script>
// ── PAIRS CONFIG ──
const PAIRS = [
  { base:'SOXX', lev:'SOXL', mult:'3x', note:'Semis Sector ETF' },
  { base:'NVDA', lev:'NVDL', mult:'2x', note:'Nvidia' },
  { base:'AMD',  lev:'AMDL', mult:'2x', note:'Advanced Micro Devices' },
  { base:'MU',   lev:'SOXL', mult:'3x proxy', note:'Micron → Sector proxy' },
  { base:'MRVL', lev:'MVLL', mult:'2x', note:'Marvell Technology' },
  { base:'SNDK', lev:'SNXX', mult:'2x', note:'SanDisk' },
  { base:'RKLB', lev:'RKLX', mult:'2x', note:'Rocket Lab' },
];

const FREE_QUICK = ['MSTR','BMNR','COIN','PLTR','HIMS','AAPL','TSLA','GOOG','AMZN','META'];

let charts = [];
let selectedPair = null;

// ── BUILD UI ──
function buildPairsGrid() {
  const grid = document.getElementById('pairsGrid');
  PAIRS.forEach((p, i) => {
    const btn = document.createElement('button');
    btn.className = 'pair-btn';
    btn.id = `pair-${i}`;
    btn.innerHTML = `<span class="pair-base">${p.base}</span><span class="pair-lev">→ ${p.lev} ${p.mult}</span>`;
    btn.onclick = () => selectPair(i);
    grid.appendChild(btn);
  });
}

function buildFreeQuick() {
  const c = document.getElementById('freeQuick');
  FREE_QUICK.forEach(t => {
    const btn = document.createElement('button');
    btn.style.cssText = 'background:var(--surface);border:1px solid var(--border);color:var(--dim);font-family:"Share Tech Mono",monospace;font-size:11px;padding:5px 10px;cursor:pointer;letter-spacing:1px;transition:all 0.2s;';
    btn.textContent = t;
    btn.onmouseover = () => { btn.style.borderColor='var(--accent)'; btn.style.color='var(--accent)'; };
    btn.onmouseout  = () => { btn.style.borderColor='var(--border)'; btn.style.color='var(--dim)'; };
    btn.onclick = () => { document.getElementById('freeInput').value = t; loadFree(); };
    c.appendChild(btn);
  });
}

function selectPair(i) {
  document.querySelectorAll('.pair-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(`pair-${i}`).classList.add('active');
  selectedPair = PAIRS[i];
}

function switchTab(t) {
  document.querySelectorAll('.tab').forEach((el,i) => el.classList.toggle('active', (i===0&&t==='pairs')||(i===1&&t==='free')));
  document.getElementById('panel-pairs').classList.toggle('visible', t==='pairs');
  document.getElementById('panel-free').classList.toggle('visible', t==='free');
}

// ── LOAD FUNCTIONS ──
async function loadPair() {
  if (!selectedPair) { setStatus('SELECT A PAIR FIRST.','err'); return; }
  const btn = document.getElementById('pairsLoadBtn');
  btn.disabled = true;
  setStatus(`FETCHING ${selectedPair.base} + ${selectedPair.lev}...`, 'loading');
  destroyCharts();
  try {
    const [baseData, levData] = await Promise.all([
      fetchWeekly(selectedPair.base),
      fetchWeekly(selectedPair.lev)
    ]);
    renderResult(selectedPair.base, baseData, selectedPair);
    setStatus(`${selectedPair.base} / ${selectedPair.lev} LOADED — ${baseData.closes.length} WEEKLY BARS`, 'ok');
  } catch(e) { setStatus(`ERROR: ${e.message}`, 'err'); }
  btn.disabled = false;
}

async function loadFree() {
  const raw = document.getElementById('freeInput').value.trim().toUpperCase();
  if (!raw) return;
  const btn = document.getElementById('freeLoadBtn');
  btn.disabled = true;
  setStatus(`FETCHING ${raw}...`, 'loading');
  destroyCharts();
  try {
    const data = await fetchWeekly(raw);
    renderResult(raw, data, null);
    setStatus(`${raw} LOADED — ${data.closes.length} WEEKLY BARS`, 'ok');
  } catch(e) { setStatus(`ERROR: ${e.message}`, 'err'); }
  btn.disabled = false;
}

function clearAll() {
  destroyCharts();
  document.getElementById('resultArea').innerHTML = `<div class="empty"><div class="icon">◈</div><p>Select a pair or key in a ticker</p></div>`;
  setStatus('CLEARED.', '');
  document.querySelectorAll('.pair-btn').forEach(b => b.classList.remove('active'));
  selectedPair = null;
}

// ── DATA FETCH ──
async function fetchWeekly(ticker) {
  const p2 = Math.floor(Date.now()/1000);
  const p1 = p2 - (52*7*24*3600*5);
  const yahooUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?interval=1wk&period1=${p1}&period2=${p2}`;

  const proxies = [
    `https://corsproxy.io/?${encodeURIComponent(yahooUrl)}`,
    `https://api.allorigins.win/get?url=${encodeURIComponent(yahooUrl)}`,
    `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(yahooUrl)}`,
  ];

  let parsed = null;
  let lastErr = 'UNKNOWN';

  for (const proxy of proxies) {
    try {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 8000);
      const res = await fetch(proxy, { signal: controller.signal });
      clearTimeout(timer);
      if (!res.ok) { lastErr = `HTTP ${res.status}`; continue; }
      const text = await res.text();
      let raw = text;
      try {
        const wrap = JSON.parse(text);
        raw = wrap.contents ? wrap.contents : text;
      } catch { raw = text; }
      const candidate = JSON.parse(raw);
      if (candidate?.chart?.result?.[0]) { parsed = candidate; break; }
      lastErr = 'NO CHART DATA';
    } catch(e) { lastErr = e.message; continue; }
  }

  if (!parsed) throw new Error(`FETCH FAILED — ${lastErr}`);

  const result = parsed.chart.result[0];
  const ts = result.timestamp;
  const q = result.indicators.quote[0];
  const clean = ts.map((t,i) => ({
    t, date: new Date(t*1000),
    o:q.open[i], h:q.high[i], l:q.low[i], c:q.close[i], v:q.volume[i]
  })).filter(d => d.c != null && d.c > 0);
  if (clean.length < 30) throw new Error(`INSUFFICIENT DATA FOR ${ticker}`);
  const closes  = clean.map(d=>d.c);
  const dates   = clean.map(d=>d.date.toLocaleDateString('en-SG',{month:'short',year:'2-digit'}));
  const volumes = clean.map(d=>d.v);
  const ma20  = sma(closes,20);
  const ma50  = sma(closes,50);
  const ma200 = sma(closes,200);
  const stoch = stochastic(clean,14,3);
  const macd  = computeMACD(closes,12,26,9);
  const meta  = parsed?.chart?.result?.[0]?.meta;
  return { ticker, name:meta?.shortName||ticker, currency:meta?.currency||'USD', dates, closes, volumes, ma20, ma50, ma200, stoch, macd, raw:clean };
}

// ── MATHS ──
function sma(data, p) {
  return data.map((_,i) => {
    if(i<p-1) return null;
    return data.slice(i-p+1,i+1).reduce((a,b)=>a+b,0)/p;
  });
}
function ema(data, p) {
  const k=2/(p+1); const out=[]; let prev=null;
  data.forEach((v,i) => {
    if(i<p-1){out.push(null);return;}
    if(prev===null){const s=data.slice(0,p).reduce((a,b)=>a+b,0)/p;out.push(s);prev=s;}
    else{const val=v*k+prev*(1-k);out.push(val);prev=val;}
  });
  return out;
}
function computeMACD(c,f,s,sig) {
  const ef=ema(c,f), es=ema(c,s);
  const ml=c.map((_,i)=>ef[i]!=null&&es[i]!=null?ef[i]-es[i]:null);
  const valid=ml.filter(v=>v!=null);
  const sr=ema(valid,sig); let si=0;
  const sl=ml.map(v=>v==null?null:sr[si++]??null);
  const hist=ml.map((v,i)=>v==null||sl[i]==null?null:v-sl[i]);
  return {ml,sl,hist};
}
function stochastic(candles,kp,smooth) {
  const rk=candles.map((_,i)=>{
    if(i<kp-1)return null;
    const sl=candles.slice(i-kp+1,i+1);
    const hi=Math.max(...sl.map(c=>c.h)), lo=Math.min(...sl.map(c=>c.l));
    return hi===lo?50:((candles[i].c-lo)/(hi-lo))*100;
  });
  const sk=sma(rk.filter(v=>v!=null),smooth); let ki=0;
  const kLine=rk.map(v=>v==null?null:sk[ki++]??null);
  const dk=sma(kLine.filter(v=>v!=null),smooth); let di=0;
  const dLine=kLine.map(v=>v==null?null:dk[di++]??null);
  return {k:kLine,d:dLine};
}

// ── PHASE DETECTION ──
function detectPhase(closes,ma20,ma50,ma200,stochK) {
  const n=closes.length-1;
  const price=closes[n], m20=ma20[n], m50=ma50[n], m200=ma200[n], sk=stochK[n];
  if(!m20||!m50) return {label:'LOADING',cls:'p-stealth',desc:'Need more bars',verdict:'WAIT'};

  // Drawdown check — 52-week high (last 52 bars)
  const lookback = Math.min(52, n);
  const high52 = Math.max(...closes.slice(n - lookback, n + 1));
  const drawdown = (high52 - price) / high52; // 0.0 to 1.0

  const slope20 = m20-(ma20[n-4]||m20);
  const slope50 = m50-(ma50[n-4]||m50);
  const belowAll = price<m20&&price<m50&&(!m200||price<m200);
  const aboveAll = price>m20&&price>m50&&(!m200||price>m200);

  // OVERRIDE: severe drawdown trumps short-term MA position
  if(drawdown >= 0.45) {
    if(sk!=null&&sk<30) return {label:'CAPITULATION · BUY ZONE',cls:'p-cap',desc:`Down ${(drawdown*100).toFixed(0)}% from 52w high · Stoch oversold · Structural damage — high risk`,verdict:'WATCH_ENTRY'};
    if(sk!=null&&sk>=30&&sk<55) return {label:'BEAR TRAP · RECOVERING',cls:'p-bear',desc:`Down ${(drawdown*100).toFixed(0)}% from 52w high · Momentum building · Not confirmed reversal`,verdict:'WATCH'};
    return {label:'DISTRIBUTION DAMAGE · CAUTION',cls:'p-dist',desc:`Down ${(drawdown*100).toFixed(0)}% from 52w high · Bounce in progress · Structural trend broken`,verdict:'CAUTION'};
  }
  if(drawdown >= 0.30) {
    if(belowAll) {
      if(sk!=null&&sk<30) return {label:'CAPITULATION · BUY ZONE',cls:'p-cap',desc:`Down ${(drawdown*100).toFixed(0)}% from 52w high · Below all MAs · Mean reversion setup`,verdict:'WATCH_ENTRY'};
      return {label:'BEAR TRAP · WATCH',cls:'p-bear',desc:`Down ${(drawdown*100).toFixed(0)}% from 52w high · Below MAs · Wait for MA20 reclaim`,verdict:'WATCH'};
    }
    // Above some MAs but still deeply down — not Mania, it's a recovery bounce
    return {label:'RECOVERY BOUNCE · CAUTION',cls:'p-stealth',desc:`Down ${(drawdown*100).toFixed(0)}% from 52w high · Short-term bounce · Not a new uptrend`,verdict:'WAIT'};
  }

  // Normal phase logic for stocks not in severe drawdown
  if(belowAll&&sk!=null&&sk<25) return {label:'CAPITULATION · BUY ZONE',cls:'p-cap',desc:'Below all MAs · Stoch oversold · Mean reversion forming',verdict:'WATCH_ENTRY'};
  if(belowAll&&sk!=null&&sk>=25) return {label:'BEAR TRAP · WATCH',cls:'p-bear',desc:'Below MAs · Momentum recovering · Wait for MA20 reclaim',verdict:'WATCH'};
  if(price<m50&&price>m20&&slope20>0) return {label:'AWARENESS PHASE · EARLY',cls:'p-awareness',desc:'Reclaiming MA20 · Buy before mania begins',verdict:'CONSIDER'};
  if(price>m50&&price>m20&&slope20>0&&slope50>0) return {label:'MANIA PHASE · TREND',cls:'p-mania',desc:'Above MA20 + MA50 · Rising slopes · Sell into greed zone',verdict:'RIDE'};
  if(m200&&price>m200*1.35&&sk!=null&&sk>75) return {label:'DISTRIBUTION · GREED',cls:'p-dist',desc:'35%+ above long mean · Stoch overbought · Institutional exit zone',verdict:'CAUTION'};
  if(price>m50&&!aboveAll) return {label:'MANIA · EXTENDED',cls:'p-mania',desc:'Above mean — momentum slowing',verdict:'RIDE_TIGHT'};
  return {label:'STEALTH · AT MEAN',cls:'p-stealth',desc:'Price at or near long-term mean · No clear signal',verdict:'WAIT'};
}

function leveragedVerdict(phase) {
  if(phase.verdict==='WATCH_ENTRY') return {v:'LEVERAGE WATCH',cls:'watch',note:'Phase supports entry setup — confirm daily signal before executing'};
  if(phase.verdict==='CONSIDER')    return {v:'LEVERAGE CONSIDER',cls:'watch',note:'Early phase — base stock reclaiming MA20 — small position only'};
  if(phase.verdict==='RIDE')        return {v:'LEVERAGE ACTIVE',cls:'go',   note:'Trend confirmed — leveraged ETF appropriate for same-session trade'};
  if(phase.verdict==='RIDE_TIGHT')  return {v:'LEVERAGE TIGHT STOPS',cls:'watch',note:'Momentum extended — reduce size, keep stops tight'};
  if(phase.verdict==='CAUTION')     return {v:'NO LEVERAGE',cls:'nogo',note:'Distribution zone — leveraged ETF exposure dangerous here'};
  return {v:'NO LEVERAGE',cls:'nogo',note:'Phase not favourable for leveraged ETF — wait for cleaner setup'};
}

// ── RENDER ──
function renderResult(ticker, data, pair) {
  const {dates,closes,ma20,ma50,ma200,stoch,macd,name,currency} = data;
  const n=closes.length-1;
  const price=closes[n], prev=closes[n-1];
  const chg=((price-prev)/prev*100).toFixed(2);
  const chgSign=chg>=0?'+':'';
  const pctMa50  = ma50[n]  ? ((price/ma50[n]-1)*100).toFixed(1)  : 'N/A';
  const pctMa200 = ma200[n] ? ((price/ma200[n]-1)*100).toFixed(1) : 'N/A';
  const phase = detectPhase(closes,ma20,ma50,ma200,stoch.k);
  const sk = stoch.k[n]?.toFixed(0)||'N/A';
  const macdVal = macd.ml[n]?.toFixed(2)||'N/A';
  const aboveMa20  = ma20[n]  && price>ma20[n];
  const aboveMa50  = ma50[n]  && price>ma50[n];
  const aboveMa200 = ma200[n] && price>ma200[n];
  const lev = pair ? leveragedVerdict(phase) : null;

  let html = `
    <div class="ticker-title">${ticker} <span style="font-size:13px;color:var(--dim);font-weight:400">· ${name}</span></div>
    <div class="ticker-meta">1W · ${currency} · LAST CLOSE ${dates[n]}</div>

    <div class="phase-banner ${phase.cls}">
      ${phase.label} &nbsp;·&nbsp;
      <span style="font-weight:300;font-size:10px;letter-spacing:1px">${phase.desc}</span>
    </div>
  `;

  // Leveraged pair card
  if(pair) {
    html += `
      <div class="lev-card">
        <div>
          <div style="font-size:10px;letter-spacing:2px;color:var(--dim);font-family:'Share Tech Mono',monospace;margin-bottom:4px">LEVERAGED PAIR</div>
          <div style="font-size:22px;font-weight:900;letter-spacing:2px;color:var(--text)">${pair.base} → <span style="color:var(--orange)">${pair.lev}</span> <span style="font-size:13px;color:var(--dim)">${pair.mult}</span></div>
        </div>
        <div>
          <div style="font-size:10px;letter-spacing:2px;color:var(--dim);font-family:'Share Tech Mono',monospace;margin-bottom:4px">VERDICT</div>
          <div class="lev-verdict ${lev.cls}">${lev.v}</div>
          <div style="font-size:10px;color:var(--dim);font-family:'Share Tech Mono',monospace;margin-top:4px;letter-spacing:1px">${lev.note}</div>
        </div>
      </div>
    `;
  }

  // MA position tags
  html += `<div class="ma-row">
    <span style="font-size:11px;color:var(--dim);font-family:'Share Tech Mono',monospace">VS MAs:</span>
    <span class="ma-tag ${aboveMa20?'above':'below'}">MA20 ${aboveMa20?'▲':'▼'}</span>
    <span class="ma-tag ${aboveMa50?'above':'below'}">MA50 ${aboveMa50?'▲':'▼'} ${pctMa50}%</span>
    ${ma200[n]?`<span class="ma-tag ${aboveMa200?'above':'below'}">MA200 ${aboveMa200?'▲':'▼'} ${pctMa200}%</span>`:''}
  </div>`;

  // Signal cards
  html += `<div class="cards-row">
    <div class="card"><div class="card-label">Price</div><div class="card-value" style="color:var(--text)">$${price.toFixed(2)}</div></div>
    <div class="card"><div class="card-label">Wk Chg</div><div class="card-value" style="color:${chg>=0?'var(--green)':'var(--red)'}">${chgSign}${chg}%</div></div>
    <div class="card"><div class="card-label">Stoch %K</div><div class="card-value" style="color:${sk<25?'var(--green)':sk>75?'var(--red)':'var(--orange)'}">${sk}</div></div>
    <div class="card"><div class="card-label">MACD</div><div class="card-value" style="color:${macdVal>=0?'var(--green)':'var(--red)'}">${macdVal}</div></div>
    <div class="card"><div class="card-label">MA50</div><div class="card-value" style="color:var(--white-ma)">${ma50[n]?'$'+ma50[n].toFixed(2):'—'}</div></div>
    <div class="card"><div class="card-label">MA200</div><div class="card-value" style="color:var(--blue-ma)">${ma200[n]?'$'+ma200[n].toFixed(2):'—'}</div></div>
  </div>`;

  // Chart containers
  html += `
    <div class="chart-wrap">
      <div class="chart-lbl">PRICE + MA20 / MA50 / MA200 — WEEKLY</div>
      <div class="legend">
        <div class="leg-item"><div class="leg-line" style="background:#26a69a"></div>PRICE</div>
        <div class="leg-item"><div class="leg-line" style="background:#e8832a"></div>MA20</div>
        <div class="leg-item"><div class="leg-line" style="background:#b0b8c8"></div>MA50 MEAN</div>
        <div class="leg-item"><div class="leg-line" style="background:#3a7bd5"></div>MA200 LONG MEAN</div>
      </div>
      <div class="chart-main"><canvas id="cPrice"></canvas></div>
    </div>
    <div class="chart-wrap">
      <div class="chart-lbl">STOCHASTIC (14,3,3) — &lt;25 OVERSOLD · &gt;75 OVERBOUGHT</div>
      <div class="chart-osc"><canvas id="cStoch"></canvas></div>
    </div>
    <div class="chart-wrap">
      <div class="chart-lbl">MACD (12,26,9)</div>
      <div class="chart-macd"><canvas id="cMacd"></canvas></div>
    </div>
  `;

  document.getElementById('resultArea').innerHTML = html;

  const base = {
    responsive:true, maintainAspectRatio:false, animation:{duration:500},
    plugins:{legend:{display:false},tooltip:{mode:'index',intersect:false,
      backgroundColor:'#ffffff',borderColor:'#c8d0dc',borderWidth:1,
      titleColor:'#6a7a90',bodyColor:'#1a2030',
      titleFont:{family:'Share Tech Mono',size:9},bodyFont:{family:'Share Tech Mono',size:10}
    }},
    scales:{
      x:{ticks:{color:'#6a7a90',font:{family:'Share Tech Mono',size:8},maxTicksLimit:10},grid:{color:'#dde2ea'}},
      y:{ticks:{color:'#6a7a90',font:{family:'Share Tech Mono',size:8}},grid:{color:'#dde2ea'},position:'right'}
    }
  };

  const pc = new Chart(document.getElementById('cPrice'),{
    type:'line', data:{labels:dates,datasets:[
      {label:'Price',data:closes,borderColor:'#26a69a',borderWidth:1.5,pointRadius:0,tension:0.1,fill:false},
      {label:'MA20', data:ma20, borderColor:'#e8832a',borderWidth:1.5,pointRadius:0,tension:0.3,fill:false},
      {label:'MA50', data:ma50, borderColor:'#b0b8c8',borderWidth:2,  pointRadius:0,tension:0.3,fill:false},
      {label:'MA200',data:ma200,borderColor:'#3a7bd5',borderWidth:2,  pointRadius:0,tension:0.3,fill:false},
    ]}, options:{...base}
  });
  charts.push(pc);

  const sc = new Chart(document.getElementById('cStoch'),{
    type:'line', data:{labels:dates,datasets:[
      {label:'%K',data:stoch.k,borderColor:'#26a69a',borderWidth:1.5,pointRadius:0,tension:0.3,fill:false},
      {label:'%D',data:stoch.d,borderColor:'#ef5350',borderWidth:1.5,pointRadius:0,tension:0.3,fill:false,borderDash:[4,3]},
    ]}, options:{...base,scales:{...base.scales,y:{...base.scales.y,min:0,max:100}}}
  });
  charts.push(sc);

  const hc = macd.hist.map(v=>v==null?'transparent':v>=0?'rgba(38,166,154,0.55)':'rgba(239,83,80,0.55)');
  const mc = new Chart(document.getElementById('cMacd'),{
    type:'bar', data:{labels:dates,datasets:[
      {type:'line',label:'MACD',  data:macd.ml,  borderColor:'#26a69a',borderWidth:1.5,pointRadius:0,tension:0.3,fill:false},
      {type:'line',label:'Signal',data:macd.sl,  borderColor:'#ef5350',borderWidth:1.5,pointRadius:0,tension:0.3,fill:false,borderDash:[4,3]},
      {type:'bar', label:'Hist',  data:macd.hist,backgroundColor:hc,borderWidth:0},
    ]}, options:{...base}
  });
  charts.push(mc);
}

function destroyCharts() { charts.forEach(c=>c.destroy()); charts=[]; }
function setStatus(msg,cls) {
  document.getElementById('statusBar').innerHTML=`<span class="${cls}">${msg}</span>`;
}

// ── ENTER KEY ──
document.addEventListener('DOMContentLoaded',()=>{
  buildPairsGrid();
  buildFreeQuick();
  document.getElementById('freeInput').addEventListener('keydown',e=>{if(e.key==='Enter')loadFree();});
});
</script>
</body>
</html>
